name: Android ARM64 native build probe

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "android-app/**"
      - "86box/**"
      - "archivers/lha/**"
      - "blkdev_cdimage.cpp"
      - "include/**"
      - "logging.cpp"
      - "od-unix/**"
      - "slirp/**"
      - "specialmonitors.cpp"
      - ".github/workflows/android-port-probe.yml"

permissions:
  contents: read

jobs:
  configure-arm64:
    name: Configure and compile WinUAE for Android ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Check out WinUAE-Android
        uses: actions/checkout@v4

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install CMake and NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          cmake --version
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Configure WinUAE for Android ARM64
        id: configure
        run: |
          cmake -S . -B build-android-probe \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWINUAE_UNIX_BUILD_EXECUTABLE=ON \
            -DWINUAE_UNIX_WITH_QT_UI=OFF \
            -DWINUAE_UNIX_WITH_INTEGRATED_QT_UI=OFF \
            -DWINUAE_UNIX_WITH_PRINTER_EMULATION=OFF \
            -DWINUAE_UNIX_WITH_LUA=OFF \
            -DWINUAE_UNIX_WITH_CAPS=OFF \
            -DWINUAE_UNIX_WITH_FLOPPYBRIDGE=OFF \
            -DWINUAE_UNIX_BUILD_FLOPPYBRIDGE_PLUGIN=OFF \
            -DWINUAE_UNIX_WITH_CHD=OFF \
            -DWINUAE_UNIX_WITH_SANA2=OFF \
            -DWINUAE_UNIX_WITH_UAESCSI=OFF \
            -DWINUAE_UNIX_WITH_AVIOUTPUT=OFF \
            -DWINUAE_UNIX_WITH_VIDEOGRAB=OFF \
            -DWINUAE_UNIX_WITH_FFMPEG=OFF \
            -DWINUAE_UNIX_WITH_OPENGL_SHADER_PIPELINE=OFF \
            -DWINUAE_UNIX_WITH_LIBPNG=OFF \
            -DWINUAE_UNIX_WITH_MIDIEMU=OFF \
            -DWINUAE_UNIX_WITH_SAMPLER=OFF \
            -DWINUAE_UNIX_WITH_NATIVE_CD=OFF \
            -DWINUAE_UNIX_WITH_NATIVE_SCSI=OFF \
            -DWINUAE_UNIX_WITH_NATIVE_HARDDRIVES=OFF \
            -DWINUAE_UNIX_WITH_MIDI=OFF \
            -DWINUAE_UNIX_WITH_UAESERIAL=OFF \
            -DWINUAE_UNIX_WITH_UAENET_PCAP=OFF \
            -DWINUAE_UNIX_WITH_PPC_QEMU=OFF \
            -DWINUAE_UNIX_BUILD_QEMU_UAE_PLUGIN=OFF \
            -DWINUAE_LZMA_SDK_FETCH=ON

      - name: Compile native Android ARM64 targets
        id: compile
        if: steps.configure.outcome == 'success'
        run: cmake --build build-android-probe --parallel 2

      - name: Install Android APK packaging tools
        if: steps.compile.outcome == 'success'
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Package installable Android APK
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p android-app/assets
          cp build-android-probe/libwinuae.so android-app/assets/libwinuae.so
          SDK_JAR="$ANDROID_HOME/platforms/android-36/android.jar" bash tools/build-android-apk.sh android-app

      - name: Upload installable Android APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: winuae-android-apk
          path: android-app/build/app.apk
          if-no-files-found: error

      - name: Upload Android ARM64 native library
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: winuae-android-arm64
          path: build-android-probe/libwinuae.so
          if-no-files-found: error

      - name: Summarize actual results
        if: always()
        run: |
          echo "Configure step: ${{ steps.configure.outcome }}"
          echo "Compile step: ${{ steps.compile.outcome }}"
          if [ -f build-android-probe/CMakeCache.txt ]; then
            grep -E '^(CMAKE_SYSTEM_NAME|CMAKE_ANDROID_ARCH_ABI|ANDROID_PLATFORM|WINUAE_UNIX_WITH_[^:]+|WINUAE_UNIX_BUILD_[^:]+):' build-android-probe/CMakeCache.txt || true
          fi
          if [ "${{ steps.configure.outcome }}" = "success" ] && [ "${{ steps.compile.outcome }}" = "success" ]; then
            echo "Android ARM64 library and installable APK build succeeded."
          elif [ "${{ steps.configure.outcome }}" = "success" ]; then
            echo "Android configuration succeeded, but native compilation exposed the next blocker."
          else
            echo "Android configuration is still blocked. See the first CMake error above."
          fi
